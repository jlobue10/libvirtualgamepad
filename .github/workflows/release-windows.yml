name: Release Windows package

on:
  push:
    tags:
      - 'v0.1.0-beta.*'

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag checkout
        run: |
          if ($env:GITHUB_REF_TYPE -cne 'tag' -or
              $env:GITHUB_REF_NAME -notmatch '^v0\.1\.0-beta\.[1-9][0-9]*$') {
            throw "Unsupported release ref '$env:GITHUB_REF'."
          }
          $head = (git rev-parse HEAD).Trim()
          $target = (git rev-parse "refs/tags/$env:GITHUB_REF_NAME`^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $target -or $head -cne $env:GITHUB_SHA) {
            throw "Tag, checkout, and workflow SHA do not resolve to the same commit."
          }

      - name: Validate case-sensitive release layout
        run: ./tools/tests/test-release-package-case.ps1

      - name: Test the kit installer's argument quoting and exit gates
        run: ./tools/tests/test-install-testdriver-gates.ps1

      - name: Resolve hosted MSBuild
        id: msbuild
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "The hosted runner has no vswhere.exe at '$vswhere'."
          }
          $vswhereVersion = (Get-Item -LiteralPath $vswhere).VersionInfo.FileVersion
          $instanceJson = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.Component.MSBuild `
            -format json `
            -utf8
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere '$vswhere' version '$vswhereVersion' failed with exit code $LASTEXITCODE."
          }
          $instances = @($instanceJson | ConvertFrom-Json)
          if ($instances.Count -ne 1) {
            throw "vswhere '$vswhere' version '$vswhereVersion' returned $($instances.Count) usable MSBuild instances; expected exactly one. Raw result: $($instanceJson -join '')"
          }
          $instancePath = [string] $instances[0].installationPath
          $checkedCandidates = @(
            Join-Path $instancePath 'MSBuild/Current/Bin/MSBuild.exe'
            Join-Path $instancePath 'MSBuild/17.0/Bin/MSBuild.exe'
          )
          $candidates = @($checkedCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Sort-Object -Unique)
          if ($candidates.Count -ne 1) {
            throw "Visual Studio '$instancePath' exposed $($candidates.Count) usable MSBuild paths; expected exactly one. Paths checked: $($checkedCandidates -join ', ')"
          }
          $msbuildPath = (Resolve-Path -LiteralPath $candidates[0]).Path
          $msbuildVersion = (Get-Item -LiteralPath $msbuildPath).VersionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($msbuildVersion)) {
            throw "MSBuild '$msbuildPath' has no inspectable file version."
          }
          Write-Output "vswhere: $vswhere ($vswhereVersion)"
          Write-Output "MSBuild: $msbuildPath ($msbuildVersion)"
          "path=$msbuildPath" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and verify the producer package
        env:
          MSBUILD_PATH: ${{ steps.msbuild.outputs.path }}
        run: |
          ./tools/build-release-package.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -OutputDir ./artifacts/release `
            -MSBuildPath $env:MSBUILD_PATH

      - name: Upload the verified release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release-${{ github.ref_name }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out the tagged publication code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the verified release set
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: windows-release-${{ github.ref_name }}
          path: release

      - name: Publish through a fail-closed API transaction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./tools/publish-release.ps1 `
            -ReleaseDir ./release `
            -Tag $env:GITHUB_REF_NAME `
            -Repository $env:GITHUB_REPOSITORY `
            -SourceRevision $env:GITHUB_SHA `
            -Token $env:GITHUB_TOKEN
